landestine operation overseas.","Clandestine deals undermined the negotiations."],synonyms:["secret","covert","surreptitious","stealthy"],antonyms:["open","overt","public","aboveboard"],collocations:["clandestine operation","clandestine affair","clandestine meeting"],commonMistake:"Stress on second syllable: clan-DES-tine, not CLAN-des-tine.",memoryTip:"Clan DES TIN E – clans hide DESTINY in a TIN secretly.",type:"word",letter:"C",dateAdded:"2024-11-05"},{id:"8",word:"Circumspect",pronunciation:"/ˈsɜːkəmspekt/",partOfSpeech:"adjective",coreMeaning:"Careful, cautious, and thoughtful before speaking or acting.",examples:["Investors are circumspect about the new market.","Be circumspect when sharing personal data online.","She gave a circumspect answer to avoid controversy."],synonyms:["cautious","wary","prudent","discreet"],antonyms:["reckless","rash","heedless","impulsive"],collocations:["be circumspect about","circumspect approach","circumspect response"],commonMistake:'Not the same as "circumstantial" – circumspect = careful, circumstantial = indirect.',memoryTip:"CIRCUM (around) + SPECT (look) – look around before you act.",type:"word",letter:"C",dateAdded:"2024-11-05"},{id:"9",word:"Compulsive",pronunciation:"/kəmˈpʌlsɪv/",partOfSpeech:"adjective",coreMeaning:"Driven by a strong, difficult-to-control urge, often involving repeated behaviour.",examples:["He is a compulsive liar who cannot stop fabricating.","Compulsive shopping left her in debt.","She felt a compulsive need to check the locks."],synonyms:["obsessive","uncontrollable","irresistible","habitual"],antonyms:["controlled","voluntary","restrained"],collocations:["compulsive behaviour","compulsive gambler","compulsive liar"],commonMistake:"Compulsive = you can’t stop; impulsive = you act without thinking – different mechanisms.",memoryTip:"COM-PULSIVE – compelled by a pulse you can’t control.",type:"word",letter:"C",dateAdded:"2024-11-06"},{id:"10",word:"Contingency plan",pronunciation:"/kənˈtɪndʒənsi plæ amiliarity breeds fondness","respect grows with knowledge"],collocations:["prove that familiarity breeds contempt","avoid familiarity breeds contempt"],commonMistake:"It’s a proverb, not literal biology – don’t use for scientific contempt.",memoryTip:"Familiar = family-like; too much family closeness can irritate.",type:"idiom",letter:"F",dateAdded:"2024-11-08"},{id:"13",word:"Fall guy",pronunciation:"/fɔːl ɡaɪ/",partOfSpeech:"noun",coreMeaning:"A person unfairly blamed or punished for something someone else did, often to protect the real culprit.",examples:["He became the fall guy for the accounting scandal.","Don’t make the intern the fall guy.","The fall guy took the blame while executives walked free."],synonyms:["scapegoat","patsy","whipping boy"],antonyms:["culprit","mastermind","perpetrator"],collocations:["be the fall guy","set up as fall guy","perfect fall guy"],commonMistake:'Not "fall’s guy" or "fault guy" – idiom is fixed.',memoryTip:"Guy who FALLS (takes the fall) while others stay standing.",type:"idiom",letter:"F",dateAdded:"2024-11-08"},{id:"14",word:"Foot soldiers",pronunciation:"/fʊt ˈsəʊldʒəz/",partOfSpeech:"noun",coreMeaning:"People who carry out practical or frontline work for a larger organisation, group, or cause.",examples:["Volunteers are the foot soldiers of the campaign.","Managers strategize while foot soldiers implement.","The party’s foot soldiers knocked on thousands of doors."],synonyms:["rank and file","ground troops","frontline workers"],antonyms:["leadership","commanders","generals"],collocations:["political foot soldiers","foot soldiers of","loyal foot soldiers"],commonMistake:'Plural form even for one group; not "foots soldiers".',memoryTip:"FOOT on ground = those actually walking the mission.",type:"phrase",letter:"F",dateAdded:"2024-11-09"},{id:"15",word:"Genuineness",pronunciation:"/ˈdʒenjʊɪnnəs/",partOfSpeech:"noun",coreMeaning:"The quality of being genuine, authentic, sincere, or not fake.",examples:["Her genuineness made everyone trust her immediately.","We value genuineness over polished performance.","The painting’s genuineness was verified by experts."],synonyms:["authenticity","sincerity","realness","honesty"],antonyms:["falseness","insincerity","artifice","fakery"],collocations:["question genuineness","prove genuineness","radiate genuineness"],commonMistake:'Spell with -ui- not -u- : genuine + ness, not "genuiness".',memoryTip:"GENUINE + NESS – the NESS of being GENUINE.",type:"word",letter:"G",dateAdded:"2024-11-09"},{id:"16",word:"Having a rough run lately",pronunciation:"/ˌhævɪŋ ə rʌf rʌn ˈleɪtli/",partOfSpeech:"phrase",coreMeaning:"Having experienced a recent period of repeated difficulties, poor results, or setbacks.",examples:["We’ve been having a rough run lately with deliveries.","She’s having a rough run lately – let’s check on her.","The team has been having a rough run lately."],synonyms:["going through a tough patch","on a losing streak","having hard times"],antonyms:["on a good run","in form","thriving"],collocations:["been having a rough run","having a rough run with"],commonMistake:'Informal – avoid in formal reports; use "experiencing difficulties".',memoryTip:"RUN as in a sequence – rough road repeated.",type:"phrase",letter:"H",dateAdded:"2024-11-10"},{id:"17",word:"Hypocrisy",pronunciation:"/hɪˈpɒkrəsi/",partOfSpeech:"noun",coreMeaning:"Claiming certain moral standards or beliefs while behaving contrary to them.",examples:["It’s hypocrisy to preach honesty while lying.","The column exposed hypocrisy in the campaign.","She called out the hypocrisy of the policy."],synonyms:["duplicity","insincerity","double standards","falseness"],antonyms:["sincerity","integrity","consistency","honesty"],collocations:["accusation of hypocrisy","sheer hypocrisy","reeks of hypocrisy"],commonMistake:"Hypocrisy is noun; hypocritical is adjective; hypocrite is person.",memoryTip:"HYPO (under) + CRISY – critic under mask.",type:"word",letter:"H",dateAdded:"2024-11-10"},{id:"18",word:"In hindsight",pronunciation:"/ɪn ˈhaɪndsʌɪt/",partOfSpeech:"phrase",coreMeaning:"Looking back at a past situation with the benefit of what is now known.",examples:["In hindsight, we should have launched earlier.","In hindsight, the warning signs were clear.","It seems obvious in hindsight."],synonyms:["looking back","retrospectively","after the fact","with hindsight"],antonyms:["in foresight","beforehand","prospectively"],collocations:["in hindsight it was","seems easy in hindsight","in hindsight bias"],commonMistake:'Not "in hind sight" two words with space – one word "hindsight".',memoryTip:"HIND = behind, SIGHT = seeing what was behind you.",type:"phrase",letter:"I",dateAdded:"2024-11-11"},{id:"19",word:"Imperative",pronunciation:"/ɪmˈperətɪv/",partOfSpeech:"adjective / noun",coreMeaning:"Extremely important, urgent, or absolutely necessary; something that must be done.",examples:["It is imperative to act now before costs rise.","Clear communication is an imperative for remote teams.","Safety training is imperative."],synonyms:["crucial","essential","vital","mandatory"],antonyms:["optional","unimportant","trivial","dispensable"],collocations:["it is imperative that","moral imperative","business imperative"],commonMistake:'As noun: "an imperative", as adjective: "imperative to do" – don’t mix with "imperative mood" in grammar unless discussing grammar.',memoryTip:"IMPERA-TIVE – emperor commands, you must obey.",type:"word",letter:"I",dateAdded:"2024-11-11"},{id:"20",word:"Ingenuity",pronunciation:"/ˌɪndʒəˈnjuːɪti/",partOfSpeech:"noun",coreMeaning:"Cleverness, creativity, and resourcefulness used to solve problems.",examples:["The team showed great ingenuity building with limited tools.","Her ingenuity turned waste into product.","Human ingenuity will solve climate challenges."],synonyms:["inventiveness","creativity","resourcefulness","cleverness"],antonyms:["unimaginativeness","ineptitude","clumsiness"],collocations:["show ingenuity","human ingenuity","feat of ingenuity"],commonMistake:'Not "ingenuinity" – from Latin ingenium, not genuine.',memoryTip:"IN-GEN-UITY – INborn GENius with U ITY.",type:"word",letter:"I",dateAdded:"2024-11-12"},{id:"21",word:"Incorporate",pronunciation:"/ɪnˈkɔːpəreɪt/",partOfSpeech:"verb",coreMeaning:"To include something as part of a larger whole, often by integrating it.",examples:["We will incorporate your feedback into the final draft.","The design incorporates sustainable materials.","The company incorporated in 2010."],synonyms:["include","integrate","embed","assimilate"],antonyms:["exclude","remove","separate","eliminate"],collocations:["incorporate into","incorporate feedback","incorporate features"],commonMistake:'Incorporate A into B, not "incorporate A with B" – use "into".',memoryTip:"IN-CORP-ORATE – bring into the CORPus/body.",type:"word",letter:"I",dateAdded:"2024-11-12"},{id:"22",word:"Impulsive",pronunciation:"/ɪmˈpʌlsɪv/",partOfSpeech:"adjective",coreMeaning:"Acting suddenly without thinking carefully about the consequences.",examples:["He made an impulsive purchase he later regretted.","Don’t make impulsive decisions under stress.","Her impulsive generosity helped many."],synonyms:["rash","hasty","spontaneous","reckless"],antonyms:["deliberate","considered","cautious","planned"],collocations:["impulsive behaviour","impulsive decision","impulsive buying"],commonMistake:"Impulsive = no forethought; compulsive = can’t stop – different.",memoryTip:"IM-PULSE – following a sudden pulse/impulse.",type:"word",letter:"I",dateAdded:"2024-11-13"},{id:"23",word:"Iterate",pronunciation:"/ˈɪtəreɪt/",partOfSpeech:"verb",coreMeaning:"To repeat a process, usually to improve or refine something.",examples:["We will iterate on the design after user testing.","The software iterates through thousands of options.","Good writers iterate constantly."],synonyms:["repeat","refine","rework","replicate"],antonyms:["stagnate","halt","finish"],collocations:["iterate quickly","iterate on design","iterate process"],commonMistake:'Not "reiterate" – reiterate = say again; iterate = do process again to improve.',memoryTip:"IT-ERATE – IT again and again to make better.",type:"word",letter:"I",dateAdded:"2024-11-13"},{id:"24",word:"Marriage of convenience",pronunciation:"/ˌmærɪdʒ əv kənˈviːniəns/",partOfSpeech:"noun",coreMeaning:"A marriage entered mainly for practical benefit rather than romantic commitment.",examples:["Their partnership was a marriage of convenience for visas.","The merger is a marriage of convenience between rivals.","Historians note many royal marriages of convenience."],synonyms:["arranged union","practical alliance","strategic partnership"],antonyms:["love match","romantic union"],collocations:["form a marriage of convenience","more than a marriage of convenience"],commonMistake:"Idiomatic – don’t literalize to every convenient marriage; implies benefit motive.",memoryTip:"MARRY for CONVENIENCE, not love – practical vows.",type:"idiom",letter:"M",dateAdded:"2024-11-14"},{id:"25",word:"Multifaceted issues",pronunciation:"/ˌmʌltiˈfæsɪtɪd ˈɪʃuːz/",partOfSpeech:"phrase",coreMeaning:"Issues that have many different aspects or dimensions and therefore are not simple or one-dimensional.",examples:["Climate change presents multifaceted issues.","We must address the multifaceted issues of poverty.","The team untangled multifaceted issues in healthcare."],synonyms:["complex issues","many-sided problems","nuanced challenges"],antonyms:["simple issues","one-dimensional problems","straightforward matters"],collocations:["address multifaceted issues","tackle multifaceted issues","understand multifaceted issues"],commonMistake:'Faceted not "facetted" – one T, from facets of a gem.',memoryTip:"MULTI + FACETED – like a diamond with many faces.",type:"phrase",letter:"M",dateAdded:"2024-11-14"},{id:"26",word:"Nature abhors a vacuum",pronunciation:"/ˈneɪtʃər əbˌhɔːz ə ˈvækjuːm/",partOfSpeech:"proverb",coreMeaning:"Empty spaces, roles, or gaps tend to be filled by something or someone.",examples:["When the manager left, nature abhors a vacuum – two people fought for the role.","In politics, nature abhors a vacuum and opportunists fill it.","An empty shelf? Nature abhors a vacuum; it will soon be cluttered."],synonyms:["power vacuum fills","emptiness invites filling","gap gets filled"],antonyms:["vacuum remains","emptiness persists"],collocations:["nature abhors a vacuum in politics","demonstrates that nature abhors a vacuum"],commonMistake:"Use for metaphorical gaps – not only physics; originally Aristotle.",memoryTip:"NATURE hates emptiness – like air rushing into vacuum.",type:"expression",letter:"N",dateAdded:"2024-11-15"},{id:"27",word:"No honour amongst thieves",pronunciation:"/nəʊ ˈɒnər əˈmʌŋst θiːvz/",partOfSpeech:"proverb",coreMeaning:"People who act dishonestly or criminally may not be loyal to one another.",examples:["They betrayed each other – no honour amongst thieves.","His partner testified against him; no honour amongst thieves.","The gang split revealed no honour amongst thieves."],synonyms:["thieves betray each other","criminals lack loyalty","dishonest distrust"],antonyms:["honour among thieves (ironic)","criminal loyalty"],collocations:["prove there is no honour amongst thieves","saying goes no honour amongst thieves"],commonMistake:'UK "honour" vs US "honor" – keep spelling consistent.',memoryTip:"If you steal, you’ll steal trust too – no loyalty.",type:"expression",letter:"N",dateAdded:"2024-11-15"},{id:"28",word:"Obsolete",pronunciation:"/ˈɒbsəliːt/",partOfSpeech:"adjective",coreMeaning:"No longer used, useful, or relevant because it has been replaced by something newer or better.",examples:["Floppy disks are now obsolete.","His skills became obsolete after automation.","The manual is obsolete; use the new guide."],synonyms:["outdated","outmoded","antiquated","archaic"],antonyms:["current","modern","cutting-edge","contemporary"],collocations:["become obsolete","render obsolete","obsolete technology"],commonMistake:'Not "obselete" – O-B-S-O-L-E-T-E.',memoryTip:"OB-SO-LETE – SO LATE it’s OUT.",type:"word",letter:"O",dateAdded:"2024-11-16"},{id:"29",word:"Overkill",pronunciation:"/ˈəʊvəkɪl/",partOfSpeech:"noun",coreMeaning:"Using much more force, effort, or resources than are necessary.",examples:["Hiring five designers for a logo is overkill.","The security measures felt like overkill.","That apology email was overkill."],synonyms:["excess","exaggeration","overdoing","surplus"],antonyms:["underkill","insufficiency","restraint","minimalism"],collocations:["bit of overkill","total overkill","be overkill"],commonMistake:'Often used as noun: "is overkill"; as verb informal "to overkill" less common.',memoryTip:"OVER + KILL – killing a fly with cannon.",type:"word",letter:"O",dateAdded:"2024-11-16"},{id:"30",word:"Preposterous",pronunciation:"/prɪˈpɒstərəs/",partOfSpeech:"adjective",coreMeaning:"Completely unreasonable, absurd, or ridiculous.",examples:["It’s preposterous to expect results overnight.","The price they quoted was preposterous.","His excuse was utterly preposterous."],synonyms:["absurd","ridiculous","outrageous","ludicrous"],antonyms:["reasonable","sensible","plausible","rational"],collocations:["utterly preposterous","seems preposterous","preposterous idea"],commonMistake:"Pronounced pre-POS-ter-ous, not pre-PROS-ter-ous.",memoryTip:"PRE-POSTEROUS – pre (before) + posterous (behind) – backwards, absurd.",type:"word",letter:"P",dateAdded:"2024-11-17"},{id:"31",word:"Reckless abandon",pronunciation:"/ˈrekləs əˈbændən/",partOfSpeech:"phrase",coreMeaning:"Acting with complete freedom or enthusiasm without caring about risks or consequences.",examples:["They danced with reckless abandon at the festival.","He invested with reckless abandon and lost everything.","Kids played with reckless abandon in the park."],synonyms:["wild enthusiasm","carefree","uninhibited","heedlessness"],antonyms:["caution","restraint","carefulness","prudence"],collocations:["with reckless abandon","throw caution with reckless abandon"],commonMistake:'It’s "abandon" noun meaning lack of restraint, not verb "abandon".',memoryTip:"Reckless = no reckoning, ABANDON = abandon all caution.",type:"phrase",letter:"R",dateAdded:"2024-11-17"},{id:"32",word:"Relevance",pronunciation:"/ˈreləvəns/",partOfSpeech:"noun",coreMeaning:"The quality of being important, useful, or directly connected to a subject or situation.",examples:["The relevance of his research to climate policy is clear.","This article has no relevance to our discussion.","We questioned the relevance of the extra data."],synonyms:["pertinence","significance","applicability","importance"],antonyms:["irrelevance","unimportance","inapplicability"],collocations:["of relevance","question relevance","have relevance to"],commonMistake:'Relevance to, not "relevance of" when connecting to topic? Both okay but "to" is link.',memoryTip:"RELEVANCE – RELEVANT + ANCE – state of being relevant.",type:"word",letter:"R",dateAdded:"2024-11-18"},{id:"33",word:"Reprieve",pronunciation:"/rɪˈpriːv/",partOfSpeech:"noun / verb",coreMeaning:"Temporary relief from punishment or an unpleasant situation; especially a postponement of punishment.",examples:["The rain gave us a brief reprieve from the heat.","The governor granted a reprieve to the prisoner.","This deal is only a temporary reprieve."],synonyms:["respite","relief","postponement","pardon"],antonyms:["continuation","punishment","enforcement"],collocations:["grant a reprieve","brief reprieve","temporary reprieve"],commonMistake:'Not "reprieve" pronounced re-PRIVE? Actually ri-PREEV.',memoryTip:"RE-PRIEVE – REprieves you, like a PRIEve of punishment.",type:"word",letter:"R",dateAdded:"2024-11-18"},{id:"34",word:"Reinvent itself",pronunciation:"/ˌriːɪnˈvent ɪtˈself/",partOfSpeech:"verb phrase",coreMeaning:"To change or transform significantly in order to improve, adapt, remain relevant, or succeed again.",examples:["The brand had to reinvent itself after scandal.","She reinvented herself as a novelist at 50.","Cities must reinvent themselves to attract talent."],synonyms:["transform","rebrand","overhaul","remake"],antonyms:["stagnate","remain static","stay same"],collocations:["need to reinvent itself","ability to reinvent itself","reinvent itself as"],commonMistake:'Reflexive: "reinvent itself" not "reinvent its self" – one word.',memoryTip:"RE-INVENT-SELF – invent your self again, new version.",type:"phrase",letter:"R",dateAdded:"2024-11-19"},{id:"35",word:"Repulsive",pronunciation:"/rɪˈpʌlsɪv/",partOfSpeech:"adjective",coreMeaning:"Extremely unpleasant or disgusting; causing strong dislike or disgust.",examples:["The smell from the bins was repulsive.","His behaviour was repulsive and unacceptable.","I find cruelty to animals repulsive."],synonyms:["disgusting","revolting","abhorrent","repellent"],antonyms:["attractive","appealing","pleasant","delightful"],collocations:["utterly repulsive","find repulsive","repulsive smell"],commonMistake:"Repulsive vs compulsive? Repulsive = disgusting; compulsive = uncontrollable urge.",memoryTip:"RE-PULSIVE – you want to RE-PULSE away.",type:"word",letter:"R",dateAdded:"2024-11-19"},{id:"36",word:"Rough patch",pronunciation:"/rʌf pætʃ/",partOfSpeech:"noun",coreMeaning:"A temporary period of difficulty, trouble, or problems.",examples:["Their marriage hit a rough patch last year.","The company is going through a rough patch.","Every career has a rough patch."],synonyms:["difficult period","hard time","bumpy phase","troubled spell"],antonyms:["smooth sailing","good spell","golden period"],collocations:["hit a rough patch","going through a rough patch","rough patch in relationship"],commonMistake:"Patch as period, not literal fabric – idiomatic.",memoryTip:"Life fabric has ROUGH PATCHES sewn in temporarily.",type:"phrase",letter:"R",dateAdded:"2024-11-20"},{id:"37",word:"Rough run",pronunciation:"/rʌf rʌn/",partOfSpeech:"noun",coreMeaning:"A period or series of repeated bad results, difficulties, or setbacks.",examples:["The striker has had a rough run in front of goal.","We’ve had a rough run with injuries this season.","Startups often have a rough run initially."],synonyms:["bad streak","losing streak","hard stretch","lean period"],antonyms:["good run","winning streak","purple patch"],collocations:["have a rough run","rough run of form","rough run of results"],commonMistake:"Run = sequence, not jogging – context matters.",memoryTip:"RUN of results that are ROUGH.",type:"phrase",letter:"R",dateAdded:"2024-11-20"},{id:"38",word:"Segregate",pronunciation:"/ˈseɡrɪɡeɪt/",partOfSpeech:"verb",coreMeaning:"To separate people or things into distinct groups; can be neutral or, in social contexts, discriminatory.",examples:["We segregate waste into recycling and landfill.","Laws once segregated schools by race.","The lab segregates samples by type."],synonyms:["separate","divide","isolate","partition"],antonyms:["integrate","mix","combine","unite"],collocations:["segregate into","segregate by","segregate from"],commonMistake:'Sensitive history – use neutral "separate" unless discussing discrimination intentionally.',memoryTip:"SE-GREGATE – GREG = flock; SE = apart – separate from flock.",type:"word",letter:"S",dateAdded:"2024-11-21"},{id:"39",word:"Social construct",pronunciation:"/ˌsəʊʃl ˈkɒnstrʌkt/",partOfSpeech:"noun",coreMeaning:"A concept or category shaped or created by society and culture rather than being purely natural or biological.",examples:["Gender roles are often described as a social construct.","Money is a powerful social construct.","Race is widely understood as a social construct."],synonyms:["cultural invention","societal concept","shared belief"],antonyms:["biological fact","natural phenomenon"],collocations:["mere social construct","understood as social construct","not just a social construct"],commonMistake:'Doesn’t mean "not real" – constructs have real consequences.',memoryTip:"SOCIALly CONSTRUCTed – society builds it.",type:"phrase",letter:"S",dateAdded:"2024-11-21"},{id:"40",word:"Stock-in-trade",pronunciation:"/ˌstɒk ɪn ˈtreɪd/",partOfSpeech:"noun",coreMeaning:"A characteristic method, behaviour, skill, or approach that someone regularly uses.",examples:["Sarcasm is his stock-in-trade.","Storytelling is her stock-in-trade as a teacher.","Discounts became their stock-in-trade to win customers."],synonyms:["trademark","forte","specialty","signature"],antonyms:["weakness","occasional tactic"],collocations:["part of stock-in-trade","usual stock-in-trade","stock-in-trade phrase"],commonMistake:'Hyphenated as noun phrase, not "stock in trade" loose without hyphens in formal.',memoryTip:"Stock you keep IN your TRADE toolkit – your go-to.",type:"phrase",letter:"S",dateAdded:"2024-11-22"},{id:"41",word:"Succinct",pronunciation:"/səkˈsɪŋkt/",partOfSpeech:"adjective",coreMeaning:"Clearly and effectively expressed in few words; brief without losing the essential meaning.",examples:["Her summary was succinct and persuasive.","Please keep your feedback succinct.","He gave a succinct explanation of the issue."],synonyms:["concise","brief","pithy","compact"],antonyms:["verbose","wordy","lengthy","long-winded"],collocations:["succinct summary","succinct answer","succinct and clear"],commonMistake:"Positive – brief but good; terse can be negative (rude).",memoryTip:"SUCCINCT – SUCCinct like SHORT + CINCH – cinched tight.",type:"word",letter:"S",dateAdded:"2024-11-22"},{id:"42",word:"Terse",pronunciation:"/tɜːs/",partOfSpeech:"adjective",coreMeaning:"Using very few words, often in a way that sounds abrupt, cold, or unfriendly.",examples:["His reply was terse and left no room for discussion.",'The email was terse: "Not possible."',"She became terse when pressed."],synonyms:["curt","brusque","laconic","abrupt"],antonyms:["verbose","expansive","wordy","friendly"],collocations:["terse reply","terse statement","terse email"],commonMistake:"Terse implies rudeness; succinct implies clarity – tone differs.",memoryTip:"TERSE – sounds like TERSE, sharp, cuts short.",type:"word",letter:"T",dateAdded:"2024-11-23"},{id:"43",word:"Theatrics",pronunciation:"/θiˈætrɪks/",partOfSpeech:"noun",coreMeaning:"Exaggerated or dramatic behaviour intended to attract attention or create an emotional effect.",examples:["We’re tired of his political theatrics.","She dismissed the apology as mere theatrics.","The press conference was full of theatrics."],synonyms:["drama","melodrama","showmanship","histrionics"],antonyms:["sincerity","restraint","understatement"],collocations:["political theatrics","emotional theatrics","mere theatrics"],commonMistake:'Plural noun but often singular in meaning; "a theatric" rare.',memoryTip:"THEATR-ics – like THEATRE – acting for audience.",type:"word",letter:"T",dateAdded:"2024-11-23"},{id:"44",word:"That’s the way the cookie crumbles",pronunciation:"/ðæts ðə weɪ ðə ˈkʊki ˈkrʌmblz/",partOfSpeech:"idiom",coreMeaning:"An informal way of saying that sometimes things happen in an unavoidable or disappointing way and must be accepted.",examples:["We lost the contract – that’s the way the cookie crumbles.","Not everyone will like you; that’s the way the cookie crumbles.","Plans changed – that’s the way the cookie crumbles."],synonyms:["that’s life","such is life","it is what it is"],antonyms:["we can change it","not inevitable"],collocations:["well that’s the way the cookie crumbles","accept that’s the way the cookie crumbles"],commonMistake:"Informal – not for formal reports or academic writing.",memoryTip:"Cookies crumble messily – can’t control every crumb.",type:"idiom",letter:"T",dateAdded:"2024-11-24"},{id:"45",word:"Touch and go",pronunciation:"/ˌtʌtʃ ən ˈɡəʊ/",partOfSpeech:"adjective",coreMeaning:"Uncertain or doubtful; in sport, often means it is uncertain whether a player will be fit or available for a match.",examples:["It was touch and go whether we’d make the flight.","His injury is touch and go for Saturday.","The project was touch and go for months."],synonyms:["uncertai <script>
(function(){
  const styleId='mickey-ai-style';
  function style(){
    if(document.getElementById(styleId)) return;
    const s=document.createElement('style'); s.id=styleId;
    s.textContent=`
      #mickeyAIBox{margin-top:10px;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--card)}
      #mickeyAIBtn{width:100%;height:44px;border:0;border-radius:12px;background:var(--ink);color:var(--paper);font-weight:700}
      #mickeyAIBtn:disabled{opacity:.55}
      #mickeyAINote{margin-top:7px;font-size:11px;line-height:1.45;color:var(--ink-faint)}
      #mickeyAIStatus{margin-top:7px;font-size:12px;font-weight:600}
    `;
    document.head.appendChild(s);
  }
  function field(label){
    const labels=[...document.querySelectorAll('label')];
    const l=labels.find(x=>x.textContent.trim().toLowerCase().startsWith(label.toLowerCase()));
    return l?.parentElement?.querySelector('input,textarea,select')||null;
  }
  function setVal(el,val){
    if(!el || val==null || val==='') return;
    const proto=el.tagName==='TEXTAREA'?HTMLTextAreaElement.prototype:HTMLInputElement.prototype;
    const setter=Object.getOwnPropertyDescriptor(proto,'value')?.set;
    if(setter) setter.call(el,val); else el.value=val;
    el.dispatchEvent(new Event('input',{bubbles:true}));
    el.dispatchEvent(new Event('change',{bubbles:true}));
  }
  function uniq(a){return [...new Set((a||[]).map(x=>String(x).trim()).filter(Boolean))];}
  function sentence(term,meaning,style){
    const templates = style==='phrase' ? [
      `The opportunity is ${term}, so we should not ignore it.`,
      `The situation is ${term}, and we need to respond wisely.`,
      `With the new service available, help is now ${term}.`
    ] : [
      `I learned the word "${term}" and used it correctly in a sentence.`,
      `Her decision showed how ${term} can affect the situation.`,
      `The manager used the word "${term}" during the meeting.`
    ];
    return templates;
  }
  function memory(term,meaning){
    const clean=term.replace(/\s+/g,' ').trim();
    return `${clean.toUpperCase()} — connect it to this idea: ${meaning.replace(/[.]+$/,'')}.`;
  }

  }

  }
  function phraseKnown(term){
    const t=term.trim().toLowerCase();
    if(t==='pernicious') return {
      meaning:'Having a harmful, damaging, or destructive effect, especially one that develops gradually or is not immediately obvious. It is often used for influences, habits, ideas, effects, or practices that cause serious long-term harm.',
      pos:'adjective', pronunciation:'/pəˈnɪʃəs/ (British); /pərˈnɪʃəs/ (American)',
      examples:[
        'Excessive fear can have a pernicious effect on your confidence.',
        'Poor risk management can be pernicious to a Forex trader’s long-term success.',
        'The pernicious spread of gossip damaged trust within the team.'
      ],
      synonyms:['harmful','damaging','detrimental','destructive','injurious','deleterious'],
      antonyms:['beneficial','helpful','harmless','salutary'],
      collocations:['pernicious effect','pernicious influence','pernicious habit','pernicious consequences','pernicious practice'],
      commonMistake:'Do not use “pernicious” for every small inconvenience. It usually describes serious or lasting harm, often harm that is gradual or not immediately obvious. “Harmful” is more general and conversational.',
      memoryTip:'Think of PERNICIOUS as a hidden poison: it quietly causes harm over time.',
      }; 
    if(t==='at your doorstep' || t==='at your door step') return {
      meaning:'Very close to you or immediately available; figuratively, a situation, opportunity, problem, or event that has arrived and is ready to be dealt with.',
      pos:'phrase', pronunciation:'/ət jɔː ˈdɔːstep/',
      examples:[
        'The opportunity is at your doorstep, so take advantage of it.',
        'The crisis has arrived at our doorstep, and we must respond.',
        'With the new branch opening nearby, quality service is now at your doorstep.'
      ],
      synonyms:['very near you','close at hand','within reach','on your doorstep'],
      antonyms:['far away','out of reach','distant'],
      collocations:['at your doorstep','right at your doorstep','bring something to your doorstep'],
      commonMistake:'The standard form is "at your doorstep" (one word: doorstep), not "at your door step".',

          }
        }
        d={meaning,pos,pronunciation:e?.phonetics?.find(p=>p.text)?.text||'',examples:uniq(examples).slice(0,3),

    if(!d.meaning && dm[0]?.defs?.[0]) d.meaning=dm[0].defs[0].replace(/^[a-z]+\t/,'');

        const r=await fetch('https://api.datamuse.com/words?rel_syn='+encodeURIComponent(term)+'&max=8');

  async function enrich(btn){
    const w=field('Word / Phrase');
    if(!w?.value.trim()){alert('Enter the new word or phrase first.');w?.focus();return;}
    const term=w.value.trim();
    const typeEl=field('Type'), requestedType=typeEl?.value||'word';
    const box=document.getElementById('mickeyAIBox'), status=document.getElementById('mickeyAIStatus');
    btn.disabled=true; btn.textContent='✨ Building your full dictionary entry…';
    status.textContent='Finding reliable meaning and language data…';
    try{
      let data=phraseKnown(term);
      if(!data) data=await publicLookup(term);
      if(!data) throw new Error('No source data');
      const phrase=/\s/.test(term)||requestedType==='phrase';
      const pos=data.pos || (phrase?'phrase':'noun');
      const meaning=data.meaning || `A useful English ${phrase?'phrase':'word'} whose meaning should be confirmed before formal use.`;
      const examples=(data.examples||[]).length?data.examples:sentence(term,meaning,phrase?'phrase':'word');
      const synonyms=(data.synonyms||[]).length?data.synonyms:[];
      const antonyms=(data.antonyms||[]).length?data.antonyms:[];
      const cols=data.collocations?.length?data.collocations:collocations(term);
      const common=data.commonMistake || mistake(term,pos);
      const mem=data.memoryTip || memory(term,meaning);

      setVal(field('Core Meaning'),meaning);
      setVal(field('POS'),pos);
      setVal(field('Pronunciation'),data.pronunciation||'');
      setVal(field('Examples'),examples.join('\n'));
      setVal(field('Synonyms'),synonyms.join(', '));
      setVal(field('Antonyms'),antonyms.join(', '));
      setVal(field('Collocations'),cols.join(', '));
      setVal(field('Common Mistake'),common);
      setVal(field('Memory Tip'),mem);

      status.textContent='✓ Entry generated. Review all fields; if a synonym or antonym list is empty, that source did not provide one. Tap Add to library to save.';
      btn.textContent='✓ Entry generated — review & save';
    }catch(err){
      status.textContent='No reliable online definition was found. You can still enter the details manually.';
      btn.textContent='↻ Try Again';
    }finally{btn.disabled=false;}
  }
  function mount(){
    style();
    const w=field('Word / Phrase');
    if(!w || document.getElementById('mickeyAIBox')) return;
    const box=document.createElement('div'); box.id='mickeyAIBox';
    const b=document.createElement('button'); b.id='mickeyAIBtn'; b.type='button';
    b.textContent='✨ Auto-Create Full Entry';
    b.onclick=()=>enrich(b);
    const note=document.createElement('div'); note.id='mickeyAINote';
    note.textContent='Type only the word or phrase. The dictionary will build the meaning, examples, synonyms, antonyms, collocations, common-mistake note and memory tip automatically. Internet is needed for the online lookup.';
    const st=document.createElement('div'); st.id='mickeyAIStatus';
    box.append(b,note,st);
    w.parentElement.appendChild(box);
  }
  new MutationObserver(mount).observe(document.documentElement,{subtree:true,childList:true});
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',mount); else mount();
})();
</script>
